name: Build & Release Aneqh APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Aneqh APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Keystore & Environment Files
        run: |
          # 1. Create .env if missing
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Decode debug.keystore from base64 if present
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          # 3. Ensure gradlew is executable
          chmod +x gradlew || true

      - name: Build Debug APK with Gradle
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Locate & Prepare Output APK
        run: |
          mkdir -p release_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release_apk/Aneqh-debug.apk \;
          ls -la release_apk/

      - name: Upload APK to Artifacts (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: Aneqh-Android-APK
          path: release_apk/Aneqh-debug.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: always()
        continue-on-error: true
        with:
          tag_name: release-v1.0.${{ github.run_number }}
          name: Aneqh Official APK v1.0.${{ github.run_number }}
          body: |
            ## 📱 ANEQH Official App APK
            - **App Name**: Aneqh
            - **Contents**: Inspector Chalisa 12 Chapters, Speed Quiz Drills, 10x Solvers, Formula Cheat Sheets.
            - **Download**: Click `Aneqh-debug.apk` below to download and install on your phone.
          files: release_apk/Aneqh-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
